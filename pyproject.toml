[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-code-posttraining"
version = "0.1.0"
description = "Reproducible Qwen3 code post-training with verl"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
cloud = [
  "accelerate>=1.2",
  "transformers>=4.51,<5",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
