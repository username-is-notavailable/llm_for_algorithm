experiment:
  name: m6-sft-local-technical-smoke
  output_dir: outputs/training
  seed: 42
model:
  name_or_path: Qwen/Qwen3-0.6B-Base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  dtype: bfloat16
  attn_implementation: flash_attention_2
data:
  path: data/processed/sft_1k.jsonl
  selection: shortest
  limit: 2
  max_length: 16384
training:
  max_steps: 2
  per_device_train_batch_size: 1
  global_batch_size: 1
  learning_rate: 0.00002
  lr_scheduler_type: constant
  warmup_steps: 0
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  tf32: true
  gradient_checkpointing: false
  logging_steps: 1
  save_strategy: steps
  save_steps: 1
  save_total_limit: 2
  dataloader_num_workers: 0
